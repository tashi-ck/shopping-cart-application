services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ShoppingCart
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./ShoppingCart_Backend
    restart: unless-stopped
    depends_on: [db]
    env_file: .env

  recs:
    build: ./recommendation-service
    restart: unless-stopped
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/ShoppingCart

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend-dist:/srv
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy_data: